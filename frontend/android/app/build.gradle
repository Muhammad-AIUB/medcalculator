apply plugin: 'com.android.application'

// The version lives in version.properties, one directory up, so that a build
// signed by hand in Android Studio and a build produced by CI cannot report
// different numbers. A tagged CI run overrides both from the tag.
def versionProps = new Properties()
def versionPropsFile = file('../version.properties')
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def resolvedVersionCode = (System.getenv('APP_VERSION_CODE')
        ?: versionProps.getProperty('versionCode', '1')).toInteger()
def resolvedVersionName = System.getenv('APP_VERSION_NAME')
        ?: versionProps.getProperty('versionName', '1.0')

// Signing for the sideloadable test build, and only that. The Play upload key
// never appears here - it stays in Android Studio's own dialog on the
// maintainer's machine. With no environment set, which is every local build,
// no signingConfig is attached at all and nothing changes.
def ciKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def hasCiKeystore = ciKeystorePath != null && !ciKeystorePath.isEmpty() && file(ciKeystorePath).exists()

android {
    namespace = "com.exhort.pocketcalculator"
    compileSdk = rootProject.ext.compileSdkVersion

    signingConfigs {
        if (hasCiKeystore) {
            ciTest {
                storeFile file(ciKeystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId "com.exhort.pocketcalculator"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            // R8 code + resource shrinking for a smaller Play Store download.
            // Capacitor + its plugins ship consumer ProGuard rules; add any
            // app-specific keeps to proguard-rules.pro. Test a release build/AAB.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasCiKeystore) {
                signingConfig signingConfigs.ciTest
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
