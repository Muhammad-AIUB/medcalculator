name: Android CI

# One pipeline, three things, in this order.
#
# 1. The gate - type-check, lint, the unit tests, the static export - runs for
#    every push and every pull request.
# 2. The release bundle. This is the variant that reaches Play, and the only one
#    that runs R8 and the resource shrinker. Building it here means a keep-rule
#    that strips something Capacitor loads reflectively fails a workflow instead
#    of a patient's phone.
# 3. The sideloadable APK. It is the *release* variant signed with a throwaway
#    test key held in Actions secrets - never the Play upload key, which stays in
#    Android Studio on the maintainer's machine. The APK published before this
#    was the debug variant, debuggable=true, which Capacitor reads directly to
#    switch on WebView inspection and logging.
#
# Without the ANDROID_KEYSTORE_BASE64 secret the first two still run and nothing
# is published, which is the safe way round.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Secrets cannot be read in an `if:`, so presence is hoisted into a plain
      # boolean here and tested as env.HAS_KEYSTORE below.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Capacitor 8's CLI refuses to run on anything below Node 22.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile pins and fails if the lockfile and package.json disagree,
      # instead of quietly resolving something newer than what was tested.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npx next lint

      # These cover the formulas, the registry wiring, the conversion factors
      # and the form guards. A red suite must not reach an installable file.
      - name: Unit tests
        working-directory: frontend
        run: npm test

      # version.properties is the single source: Gradle reads it here and in
      # Android Studio, so the AAB signed by hand for Play and anything CI
      # builds carry identical numbers. A tag does not override it - it is
      # checked against it, which is the only arrangement where the two cannot
      # drift apart. Deriving the code in CI alone would have left a local
      # build on the file's number and the release notes on the tag's.
      - name: Check the tag against version.properties
        id: version
        run: |
          set -euo pipefail
          FILE=frontend/android/version.properties
          FILE_NAME=$(grep -E '^versionName=' "$FILE" | cut -d= -f2)
          FILE_CODE=$(grep -E '^versionCode=' "$FILE" | cut -d= -f2)
          echo "name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$FILE_CODE" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Untagged build: $FILE_NAME (versionCode $FILE_CODE)"
            exit 0
          fi
          VER="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJ MIN PAT <<< "$VER"
          WANT_CODE=$(( MAJ * 1000000 + MIN * 1000 + PAT ))
          if [ "$FILE_NAME" != "$VER" ] || [ "$FILE_CODE" != "$WANT_CODE" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} wants versionName=$VER and versionCode=$WANT_CODE, but $FILE has versionName=$FILE_NAME and versionCode=$FILE_CODE. Fix the file, commit, delete the tag and re-tag."
            exit 1
          fi
          echo "Tagged build: $VER (versionCode $WANT_CODE)"

      - name: Build Next.js static export
        working-directory: frontend
        run: npm run build

      # Capacitor 8 compiles its Android library at Java 21.
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # `cap add` is gone on purpose: the android project is committed, and
      # adding it fresh would reset the versionCode and the release config.
      # sync copies the web build in and refreshes the plugin list.
      - name: Copy web assets to Android
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      # Written outside the workspace so it cannot be committed by a later step
      # or swept into an artifact.
      - name: Decode test keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/ci-test.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ci-test.jks" >> "$GITHUB_ENV"

      - name: Build release bundle
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      # Kept so a shrinker problem can be inspected rather than guessed at, and
      # so the CI build can be diffed against whatever was signed locally.
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error

      - name: Build release APK for sideloading
        if: env.HAS_KEYSTORE == 'true'
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Proves what is about to be published rather than trusting the build
      # type: not debuggable, and not signed by Android's debug certificate.
      - name: Verify the APK before publishing
        if: env.HAS_KEYSTORE == 'true'
        run: |
          set -euo pipefail
          APK=frontend/android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::APK is signed with the Android debug certificate"
            exit 1
          fi
          if "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::APK is debuggable"
            exit 1
          fi
          cp "$APK" MedCalcPro.apk
          echo "Signed, not debuggable: $(du -h MedCalcPro.apk | cut -f1)"

      - name: Say why nothing was published
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::notice::No ANDROID_KEYSTORE_BASE64 secret, so no APK was published. The gate and the release bundle still ran."

      - name: Publish tagged release
        if: github.ref_type == 'tag' && env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "Pocket Medical Calculator ${{ github.ref_name }}"
          body: |
            Release APK for sideloading — version ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }}).

            Offline-first: install করুন, internet ছাড়াই কাজ করবে।

            Signed with the project's test key rather than the Play upload key,
            so uninstall the Play build first if you have it.
          files: MedCalcPro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish main-branch build
        if: github.ref_type == 'branch' && github.event_name == 'push' && env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "MedCalc Pro — Build ${{ github.run_number }}"
          prerelease: true
          body: |
            Development build from main. Release variant, signed with the
            project's test key — not a Play release.
          files: MedCalcPro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
