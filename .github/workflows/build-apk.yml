name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Capacitor 8's CLI refuses to run on anything below Node 22.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build Next.js static export
        working-directory: frontend
        run: npm run build

      # Capacitor 8 compiles its Android library at Java 21.
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # `cap add` is gone on purpose: the android project is committed, and
      # adding it fresh would reset the versionCode and the release config.
      # sync copies the web build in and refreshes the plugin list.
      - name: Copy web assets to Android
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk MedCalcPro.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "MedCalc Pro — Build ${{ github.run_number }}"
          body: "✅ Offline-first Android APK. Install করুন — internet ছাড়াই কাজ করবে।"
          files: MedCalcPro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
