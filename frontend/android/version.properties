# The single place the app's version lives.
#
# Android Studio reads it straight from here, so a locally signed AAB carries
# the same numbers as anything CI produces. A tagged CI build overrides both
# from the tag itself and the workflow fails if the two disagree, which is what
# stops a hand-edit here from drifting away from what was released.
#
# versionCode must only ever increase - Play rejects a re-used one. The tagged
# builds derive it as major*1000000 + minor*1000 + patch, so v1.0.5 is 1000005.
versionCode=5
versionName=1.0.4
