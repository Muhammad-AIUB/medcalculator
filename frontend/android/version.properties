# The one place the app's version lives.
#
# app/build.gradle reads it, so Android Studio and CI produce identical numbers
# and the AAB signed by hand for Play cannot disagree with what CI published.
#
# Releasing: set both fields here, commit, then tag. CI checks the tag against
# this file and fails the run if they differ, so the tag and the binary always
# describe each other. The expected code for a tag vX.Y.Z is
#
#     versionCode = X * 1000000 + Y * 1000 + Z
#
# so v1.0.5 means versionCode 1000005. The first tagged release therefore jumps
# the number a long way; that is fine and one-way - Play only requires that it
# never goes down.
#
# The values below are the untagged state, carried over from the last manual
# upload (Play has versionCode 4).
versionCode=5
versionName=1.0.4
